appId: com.eastandweast.mulspace
productName: Mulspace
copyright: Copyright © 2026 EastAndWeast
directories:
  buildResources: build
  output: release
asar: true
npmRebuild: false
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
publish:
  provider: github
  owner: EastAndWeast
  repo: Mulspace
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  icon: build/icon.png
  category: Network
  target:
    - AppImage
    - tar.gz
